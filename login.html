<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login & Register</title><link rel="stylesheet" href="./style.css"></head>
<body><main>
<div class="eyebrow">YOUR ACCOUNT</div><h1>Welcome.</h1><p>Sign in or create your account to get started.</p>
<div class="tabs" aria-label="Account action">
  <button id="loginTab" type="button" aria-pressed="true" aria-controls="loginForm">Log in</button>
  <button id="registerTab" type="button" aria-pressed="false" aria-controls="registerForm">Register</button>
</div>
<form id="loginForm">
  <label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="email" required maxlength="254">
  <label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<form id="registerForm" hidden>
  <label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="100" pattern=".*\S.*">
  <label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" autocomplete="email" required maxlength="254">
  <label for="phoneNumber">Mobile / phone number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" placeholder="+919876543210" pattern="[+]?[0-9]{7,15}" required maxlength="16" aria-describedby="phoneHint">
  <p class="hint" id="phoneHint">Use 7–15 digits, optionally starting with +. This is contact information, not a verified phone number.</p>
  <label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" autocomplete="new-password" required minlength="8">
  <label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
  <button type="submit">Create account</button>
</form>
<p id="message" class="message" role="status" aria-live="polite">Loading…</p>
<noscript>Enable JavaScript to use your account.</noscript>
</main>
<script type="module">
const message = document.querySelector('#message');
const forms = [document.querySelector('#loginForm'), document.querySelector('#registerForm')];
const tabs = [document.querySelector('#loginTab'), document.querySelector('#registerTab')];
const say = (text, kind = 'error') => { message.textContent = text; message.dataset.kind = kind; };
function busy(value) {
  document.querySelectorAll('button').forEach(button => { button.disabled = value; });
}
busy(true);
try {
  const auth = await import('./auth.js');
  tabs.forEach((tab, index) => tab.addEventListener('click', () => {
    forms.forEach((form, i) => { form.hidden = i !== index; });
    tabs.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
    say('', 'success');
  }));
  const go = () => window.location.replace('./profile.html');
  auth.onAuthChange((event, session) => { if (event === 'SIGNED_IN' && session) go(); });
  forms[0].addEventListener('submit', async event => {
    event.preventDefault(); busy(true); say('Signing in…', 'success');
    const values = new FormData(forms[0]);
    try { await auth.login(values.get('email'), values.get('password')); go(); }
    catch (error) { say(error.message); }
    finally { busy(false); }
  });
  forms[1].addEventListener('submit', async event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(forms[1]));
    if (values.password !== values.confirmPassword) { say('Passwords do not match.'); return; }
    busy(true); say('Creating your account…', 'success');
    try {
      const data = await auth.register(values);
      if (data.session) { go(); return; }
      forms[1].reset();
      say('Check your inbox for a confirmation link. If this email already has an account, log in instead.', 'success');
    } catch (error) { say(error.message); }
    finally { busy(false); }
  });
  if (await auth.currentUser()) go();
  else say('', 'success');
  busy(false);
} catch (error) { say(error.message || 'Unable to initialize. Check your connection and .env configuration.'); }
</script></body></html>
